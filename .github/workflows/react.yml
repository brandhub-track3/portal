name: Docker CI/CD

# main branch par push ya PR hone par workflow chalega
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Repository read aur GHCR image publish permissions
permissions:
  contents: read
  packages: write


jobs:

  # =========================================================
  # JOB 1: TEST AND BUILD REACT
  # =========================================================
  test-build:

    # ubuntu-latest future me Ubuntu 26 par change ho raha hai.
    # Isliye fixed Ubuntu 24.04 use kar rahe hain.
    runs-on: ubuntu-24.04

    steps:

      # Repository code GitHub runner par checkout karega.
      # v5 newer action version use kar rahe hain.
      - name: Checkout code
        uses: actions/checkout@v5


      # Node.js 24 setup karega.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm


      # package-lock.json ke exact dependencies install karega
      - name: Install dependencies
        run: npm ci


      # Jab tests ready hon to uncomment karna
      # - name: Run tests
      #   run: npm test -- --run


      # React production build verify karega
      - name: Build React application
        env:
          VITE_BRANDHUB_API_URL: ${{ secrets.VITE_BRANDHUB_API_URL }}
        run: npm run build



  # =========================================================
  # JOB 2: BUILD AND PUBLISH DOCKER IMAGE
  # =========================================================
  publish-image:

    # test-build successful hone ke baad hi chalega
    needs: test-build

    runs-on: ubuntu-24.04

    # PR par image publish nahi hogi.
    # Sirf main branch push par publish hogi.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Docker build ke liye repository checkout
      - name: Checkout code
        uses: actions/checkout@v5


      # GitHub Container Registry me login
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Docker image build
      # Ek exact commit SHA tag aur ek latest tag create hoga
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/brandhub-track3/portal:${{ github.sha }} \
            -t ghcr.io/brandhub-track3/portal:latest \
            .


      # Images GHCR me publish
      - name: Push Docker image
        run: |
          docker push ghcr.io/brandhub-track3/portal:${{ github.sha }}
          docker push ghcr.io/brandhub-track3/portal:latest



  # =========================================================
  # JOB 3: DEPLOY IMAGE TO EC2
  # =========================================================
  deploy:

    # Image successfully publish hone ke baad hi deploy
    needs: publish-image

    runs-on: ubuntu-24.04

    # Sirf main branch push par deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # EC2 SSH private key setup
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" \
            > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key


      # Exact commit SHA wali Docker image EC2 par deploy
      - name: Deploy Docker image to EC2
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "IMAGE_TAG='${{ github.sha }}' \
             VITE_API_URL='${{ secrets.VITE_BRANDHUB_API_URL }}' \
             bash -s" << 'EOF'

            # Koi command fail hui to deployment stop
            set -e


            # Exact Git commit wali Docker image
            IMAGE="ghcr.io/brandhub-track3/portal:${IMAGE_TAG}"

            echo "Deploying image: ${IMAGE}"


            # GHCR se exact Docker image pull
            docker pull "${IMAGE}"


            # Existing React container remove
            # First deployment me container na ho to error ignore
            docker rm -f brandhub-react-container || true


            # New image se container start
            docker run -d \
              --name brandhub-react-container \
              --restart unless-stopped \
              -p 3000:3000 \
              -e VITE_BRANDHUB_API_URL="${VITE_API_URL}" \
              "${IMAGE}"


            # Running container verify
            docker ps \
              --filter "name=brandhub-react-container"


            # Unused old Docker images clean
            docker image prune -f

          EOF