name: Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


jobs:

  test-build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout code
        uses: actions/checkout@v5


      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm


      - name: Install dependencies
        run: npm ci


      # - name: Run tests
      #   run: npm test -- --run


      - name: Build React application
        env:
          VITE_BRANDHUB_API_URL: ${{ secrets.VITE_BRANDHUB_API_URL }}
        run: npm run build



  publish-image:

    needs: test-build

    runs-on: ubuntu-24.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/brandhub-track3/portal:${{ github.sha }} \
            -t ghcr.io/brandhub-track3/portal:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/brandhub-track3/portal:${{ github.sha }}
          docker push ghcr.io/brandhub-track3/portal:latest



  deploy:

    needs: publish-image

    runs-on: ubuntu-24.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Setup SSH
        run: |

          # Create SSH directory
          mkdir -p ~/.ssh

          # Create temporary SSH private key from GitHub Secret
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" \
            > ~/.ssh/ec2_key

          # SSH requires restricted permissions for private keys
          chmod 600 ~/.ssh/ec2_key



      - name: Deploy Docker image to EC2
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "IMAGE_TAG='${{ github.sha }}' \
             VITE_API_URL='${{ secrets.VITE_BRANDHUB_API_URL }}' \
             bash -s" << 'EOF'

            # Immediately stop deployment if a command fails
            set -e


            # -------------------------------------------------
            # IMAGE
            # -------------------------------------------------

            # Deploy exact image belonging to this Git commit
            IMAGE="ghcr.io/brandhub-track3/portal:${IMAGE_TAG}"

            echo "Deploying image: ${IMAGE}"


            # -------------------------------------------------
            # PULL IMAGE
            # -------------------------------------------------

            # Download exact Docker image from GHCR
            docker pull "${IMAGE}"


            # -------------------------------------------------
            # REMOVE PREVIOUS CONTAINER
            # -------------------------------------------------

            # Stop and remove previous React container.
            #
            # || true is required because during first deployment
            # the container might not exist.
            docker rm -f brandhub-react-container || true


            # -------------------------------------------------
            # START NEW CONTAINER
            # -------------------------------------------------

            docker run -d \
              --name brandhub-react-container \
              --restart unless-stopped \
              -p 80:3000 \
              -e VITE_BRANDHUB_API_URL="${VITE_API_URL}" \
              "${IMAGE}"


            # -------------------------------------------------
            # VERIFY DEPLOYMENT
            # -------------------------------------------------

            # Display running React container in Actions logs
            docker ps \
              --filter "name=brandhub-react-container"


            # -------------------------------------------------
            # CLEANUP
            # -------------------------------------------------

            # Delete unused Docker image layers/images
            # to prevent EC2 disk from continually filling
            docker image prune -f

          EOF