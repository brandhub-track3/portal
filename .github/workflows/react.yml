name: Docker CI/CD

# Workflow runs when:
# 1. Code is pushed to main
# 2. Pull Request is created/updated against main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Required permissions:
# contents: read   -> checkout repository
# packages: write  -> push Docker image to GHCR
permissions:
  contents: read
  packages: write


jobs:

  # =========================================================
  # JOB 1: TEST AND BUILD REACT
  # =========================================================
  test-build:

    # Fixed Ubuntu version so ubuntu-latest changes
    # do not unexpectedly affect the pipeline
    runs-on: ubuntu-24.04

    steps:

      # Download repository code on GitHub runner
      - name: Checkout code
        uses: actions/checkout@v5


      # Install Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm


      # Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci


      # Enable this once your test cases are ready
      # If tests fail, further deployment will stop
      #
      # - name: Run tests
      #   run: npm test -- --run


      # Verify React application builds successfully
      - name: Build React application
        env:
          VITE_BRANDHUB_API_URL: ${{ secrets.VITE_BRANDHUB_API_URL }}
        run: npm run build



  # =========================================================
  # JOB 2: BUILD AND PUBLISH DOCKER IMAGE
  # =========================================================
  publish-image:

    # Run only after test-build succeeds
    needs: test-build

    runs-on: ubuntu-24.04

    # Do not publish images for PR.
    # Publish only after push/merge to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Checkout code because this is a separate GitHub runner/job
      - name: Checkout code
        uses: actions/checkout@v5


      # Login to GitHub Container Registry (GHCR)
      #
      # GITHUB_TOKEN is automatically created by GitHub.
      # packages: write permission above allows image publishing.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Build Docker image from Dockerfile
      #
      # Two tags:
      #
      # 1. github.sha
      #    Exact image for this Git commit
      #
      # 2. latest
      #    Latest successfully published image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/brandhub-track3/portal:${{ github.sha }} \
            -t ghcr.io/brandhub-track3/portal:latest \
            .


      # Upload both image tags to GHCR
      - name: Push Docker image
        run: |
          docker push ghcr.io/brandhub-track3/portal:${{ github.sha }}
          docker push ghcr.io/brandhub-track3/portal:latest



  # =========================================================
  # JOB 3: DEPLOY DOCKER IMAGE TO AWS EC2
  # =========================================================
  deploy:

    # The image must first successfully reach GHCR
    needs: publish-image

    runs-on: ubuntu-24.04

    # Deploy only on main branch push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # -------------------------------------------------------
      # SSH SETUP
      # -------------------------------------------------------
      - name: Setup SSH
        run: |

          # Create SSH directory
          mkdir -p ~/.ssh

          # Create temporary SSH private key from GitHub Secret
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" \
            > ~/.ssh/ec2_key

          # SSH requires restricted permissions for private keys
          chmod 600 ~/.ssh/ec2_key


      # -------------------------------------------------------
      # EC2 DEPLOYMENT
      # -------------------------------------------------------
      - name: Deploy Docker image to EC2
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "IMAGE_TAG='${{ github.sha }}' \
             VITE_API_URL='${{ secrets.VITE_BRANDHUB_API_URL }}' \
             bash -s" << 'EOF'

            # Immediately stop deployment if a command fails
            set -e


            # -------------------------------------------------
            # IMAGE
            # -------------------------------------------------

            # Deploy exact image belonging to this Git commit
            IMAGE="ghcr.io/brandhub-track3/portal:${IMAGE_TAG}"

            echo "Deploying image: ${IMAGE}"


            # -------------------------------------------------
            # PULL IMAGE
            # -------------------------------------------------

            # Download exact Docker image from GHCR
            docker pull "${IMAGE}"


            # -------------------------------------------------
            # REMOVE PREVIOUS CONTAINER
            # -------------------------------------------------

            # Stop and remove previous React container.
            #
            # || true is required because during first deployment
            # the container might not exist.
            docker rm -f brandhub-react-container || true


            # -------------------------------------------------
            # START NEW CONTAINER
            # -------------------------------------------------

            docker run -d \
              --name brandhub-react-container \
              --restart unless-stopped \
              -p 80:3000 \
              -e VITE_BRANDHUB_API_URL="${VITE_API_URL}" \
              "${IMAGE}"


            # -------------------------------------------------
            # VERIFY DEPLOYMENT
            # -------------------------------------------------

            # Display running React container in Actions logs
            docker ps \
              --filter "name=brandhub-react-container"


            # -------------------------------------------------
            # CLEANUP
            # -------------------------------------------------

            # Delete unused Docker image layers/images
            # to prevent EC2 disk from continually filling
            docker image prune -f

          EOF